name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Сначала временно ставим Java 17, чтобы просто сгенерировать файлы старого Gradle
    - name: Set up JDK 17 for Gradle Wrapper generation
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Генерируем Gradle 4.4.1 (он отлично работает с модами 1.12.2)
    - name: Generate Gradle 4.4.1 Wrapper
      run: gradle wrapper --gradle-version 4.4.1

    # Переключаемся обратно на Java 8, которая строго нужна для компиляции самого мода
    - name: Change to JDK 8 for Minecraft Mod Compilation
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # Делаем скрипт запуска исполняемым
    - name: Make gradlew executable
      run: chmod +x gradlew

    # Запускаем сборку мода
    - name: Build with Gradle
      run: ./gradlew build

    # Сохраняем готовый .jar файл
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrainClimb-Mod
        path: build/libs/*.jar
